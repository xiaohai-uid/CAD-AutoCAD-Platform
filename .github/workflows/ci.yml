name: unit-tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastmcp mcp pywin32 pillow pytest
      - name: Run pure-logic unit tests (no AutoCAD required)
        run: pytest -q
