services:
  gateway:
    host: 127.0.0.1
    port: 8000
  intake:
    host: 127.0.0.1
    port: 8001
  vision:
    host: 127.0.0.1
    port: 8002
  cadplan:
    host: 127.0.0.1
    port: 8003
  validation:
    host: 127.0.0.1
    port: 8004
  cad_com:
    host: 127.0.0.1
    port: 8005
  preview:
    host: 127.0.0.1
    port: 8006
  dwg_scan:
    host: 127.0.0.1
    port: 8007
  artifacts:
    host: 127.0.0.1
    port: 8008

cad:
  type: AutoCAD
  default_unit: mm
  com_timeout: 30
  com_progid: AutoCAD.Application
  startup_wait_time: 3
  command_delay: 0.1
  valid_lineweights:
    - 0
    - 5
    - 9
    - 13
    - 15
    - 18
    - 20
    - 25
    - 30
    - 35
    - 40
    - 50
    - 53
    - 60
    - 70
    - 80
    - 90
    - 100
    - 106
    - 120
    - 140
    - 158
    - 200
    - 211

output:
  dir: ./output

logging:
  level: INFO
  format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
