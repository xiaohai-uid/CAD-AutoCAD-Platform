version: "3.9"

# CAD Direct Control Platform - Docker Compose
# Note: COM automation requires Windows containers.
# Run with: docker compose -f docker-compose.yml up -d

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad-gateway
    command: python -m services.gateway.main
    ports:
      - "8000:8000"
    depends_on:
      intake:
        condition: service_started
      cadplan:
        condition: service_started
      validation:
        condition: service_started
    environment:
      - PYTHONPATH=/app
    networks:
      - cad-network

  intake:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad-intake
    command: python -m services.intake.main
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
    networks:
      - cad-network

  vision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad-vision
    command: python -m services.vision.main
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
    networks:
      - cad-network

  cadplan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad-cadplan
    command: python -m services.cadplan.main
    ports:
      - "8003:8003"
    environment:
      - PYTHONPATH=/app
    networks:
      - cad-network

  validation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad-validation
    command: python -m services.validation.main
    ports:
      - "8004:8004"
    environment:
      - PYTHONPATH=/app
    networks:
      - cad-network

  cad_com:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad-com
    command: python -m services.cad_com.main
    ports:
      - "8005:8005"
    environment:
      - PYTHONPATH=/app
    networks:
      - cad-network

  preview:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad-preview
    command: python -m services.preview.main
    ports:
      - "8006:8006"
    environment:
      - PYTHONPATH=/app
    depends_on:
      - cad_com
    networks:
      - cad-network

  dwg_scan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad-dwg-scan
    command: python -m services.dwg_scan.main
    ports:
      - "8007:8007"
    environment:
      - PYTHONPATH=/app
    depends_on:
      - cad_com
    networks:
      - cad-network

  artifacts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cad-artifacts
    command: python -m services.artifacts.main
    ports:
      - "8008:8008"
    environment:
      - PYTHONPATH=/app
    volumes:
      - cad-output:/app/output
    networks:
      - cad-network

networks:
  cad-network:
    driver: nat

volumes:
  cad-output:
