[project]
name = "cad-mcp"
version = "0.1.0"
description = "AutoCAD live-control MCP server (stdio) driven by DSH agent"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0", "pywin32>=306 ; sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["com: 需要真实 AutoCAD 的集成测试（默认不在单测集）"]
